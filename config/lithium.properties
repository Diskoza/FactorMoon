# This is the configuration file for Lithium.
#
# You can find information on editing this file and all the available options here:
# https://github.com/CaffeineMC/lithium-fabric/wiki/Configuration-File
#
# By default, this file will be empty except for this notice.

# Aeronautics/Sable move sub-levels as physics objects. Keep Lithium, but avoid
# entity collision/movement shortcuts that can desync moving sub-levels.
mixin.entity.collisions=false
mixin.experimental.entity.block_caching=false
mixin.util.entity_movement_tracking=false
